name: security-maintenance

on:
  schedule:
    - cron: '15 11 * * *' # Daily 06:15 America/Chicago (approx, UTC-based)
  workflow_dispatch:

jobs:
  verify-security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run npm audit (high+)
        run: npm audit --audit-level=high

      - name: Enforce copy policy
        run: npm run check:copy-policy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
