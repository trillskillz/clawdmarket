name: security-maintenance

on:
  schedule:
    - cron: '15 11 * * *' # Daily 06:15 America/Chicago (approx, UTC-based)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: '1'
  TURSO_DATABASE_URL: file:./ci-security.db
  JWT_SECRET: ci-jwt-secret-please-change
  CHAT_ENCRYPTION_KEY: ci-chat-encryption-key-32-bytes-minimum
  WEBHOOK_SECRET_KEY: ci-webhook-secret-key-32-bytes-minimum

permissions:
  contents: read

jobs:
  verify-security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Initialize isolated security database
        run: |
          pnpm exec drizzle-kit push --force
          pnpm run db:migrate:runtime

      - name: Audit dependencies (high+)
        run: |
          set +e
          pnpm audit --audit-level=high --json > security-audit.json
          audit_status=$?
          cat security-audit.json
          exit "$audit_status"

      - name: Retain dependency findings and open risk treatment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-maintenance-evidence
          path: |
            security-audit.json
            docs/SECURITY_RISK_BRACES_2026-10-14.md
          if-no-files-found: error

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build
