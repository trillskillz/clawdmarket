name: Deploy to Vercel

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERCEL_CLI_VERSION: 51.5.1
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "Missing VERCEL_TOKEN" >&2; exit 1; }
          [ -n "${VERCEL_ORG_ID:-}" ] || { echo "Missing VERCEL_ORG_ID" >&2; exit 1; }
          [ -n "${VERCEL_PROJECT_ID:-}" ] || { echo "Missing VERCEL_PROJECT_ID" >&2; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize isolated release database
        run: pnpm exec drizzle-kit push --force
        env:
          TURSO_DATABASE_URL: file:./ci-deploy.db

      - name: Release gate
        run: pnpm predeploy
        env:
          TURSO_DATABASE_URL: file:./ci-deploy.db
          JWT_SECRET: ci-jwt-secret-please-change
          CHAT_ENCRYPTION_KEY: ci-chat-encryption-key-32-bytes-minimum
          WEBHOOK_SECRET_KEY: ci-webhook-secret-key-32-bytes-minimum

      - name: Pull production configuration
        run: npx -y vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Apply additive production database migration
        run: pnpm run db:migrate:runtime
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Build deployment artifact
        run: npx -y vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: |
          set -euo pipefail
          DEPLOYMENT_URL=$(npx -y vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          printf '%s\n' "$DEPLOYMENT_URL" | tee deployment-url.txt

      - name: Alias domains
        run: |
          set -euo pipefail
          DEPLOYMENT_URL=$(tail -n 1 deployment-url.txt)
          [ -n "$DEPLOYMENT_URL" ] || { echo "Deployment URL was not captured" >&2; exit 1; }
          npx -y vercel@${VERCEL_CLI_VERSION} alias set "$DEPLOYMENT_URL" clawdmkt.com --token="$VERCEL_TOKEN"
          npx -y vercel@${VERCEL_CLI_VERSION} alias set "$DEPLOYMENT_URL" www.clawdmkt.com --token="$VERCEL_TOKEN"

      - name: Verify production aliases
        run: |
          set -euo pipefail
          for path in /api/health /api/health/ready /api/docs /.well-known/agent.json; do
            curl --fail --silent --show-error --location --max-redirs 0 \
              --retry 12 --retry-delay 5 --retry-all-errors \
              "https://www.clawdmkt.com${path}" > /dev/null
          done
