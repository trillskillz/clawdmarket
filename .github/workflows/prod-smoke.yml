name: Production Smoke

on:
  workflow_run:
    workflows: [Deploy to Vercel]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Production base URL (defaults to secret PROD_BASE_URL or www.clawdmkt.com)'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.base_url != '' && inputs.base_url) || (secrets.PROD_BASE_URL != '' && secrets.PROD_BASE_URL) || 'https://www.clawdmkt.com' }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      CLAWDMARKET_SELF_TEST_API_KEY: ${{ secrets.CLAWDMARKET_SELF_TEST_API_KEY }}
      WALLET_SMOKE_PRIVATE_KEY: ${{ secrets.WALLET_SMOKE_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install runtime dependencies
        run: pnpm install --frozen-lockfile --prod

      - name: Run production smoke checks
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SMOKE_EMAIL:-}" ] || [ -z "${SMOKE_PASSWORD:-}" ]; then
            echo "❌ Missing required secrets: SMOKE_EMAIL and/or SMOKE_PASSWORD"
            exit 1
          fi
          TMP_DIR="$(mktemp -d)"
          COOKIES="$TMP_DIR/cookies.txt"
          OUT="$TMP_DIR/out.json"

          pass() { echo "✅ $1"; }
          fail() { echo "❌ $1"; exit 1; }
          [ -n "${WALLET_SMOKE_PRIVATE_KEY:-}" ] || fail "Missing required secret: WALLET_SMOKE_PRIVATE_KEY"

          code=$(curl -sS -o "$OUT" -w "%{http_code}" "$BASE_URL/api/health")
          [ "$code" = "200" ] || fail "/api/health expected 200 got $code"
          pass "/api/health"

          code=$(curl -sS -o "$OUT" -w "%{http_code}" "$BASE_URL/api/health/ready")
          [ "$code" = "200" ] || fail "/api/health/ready expected 200 got $code"
          pass "/api/health/ready"

          code=$(curl -sS -H "Authorization: Bearer $CLAWDMARKET_SELF_TEST_API_KEY" -o "$OUT" -w "%{http_code}" "$BASE_URL/api/health/full")
          [ "$code" = "200" ] || fail "/api/health/full expected 200 got $code"
          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if(data.status !== 'ok') process.exit(1)" "$OUT" \
            || fail "/api/health/full did not report status=ok"
          pass "/api/health/full"

          code=$(curl -sS -H "Authorization: Bearer $CLAWDMARKET_SELF_TEST_API_KEY" -o "$OUT" -w "%{http_code}" "$BASE_URL/api/agent/self-test")
          [ "$code" = "200" ] || fail "/api/agent/self-test expected 200 got $code"
          agent_id=$(node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(data.agent_id || ''))" "$OUT")
          [ -n "$agent_id" ] || fail "/api/agent/self-test did not return agent_id"
          code=$(curl -sS -o "$OUT" -w "%{http_code}" "$BASE_URL/api/agents/$agent_id")
          [ "$code" = "200" ] || fail "authenticated agent profile expected 200 got $code"
          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if(data.availability !== 'online' || !data.is_online || !data.last_seen_at) process.exit(1)" "$OUT" \
            || fail "authenticated agent activity did not publish fresh online presence"
          pass "agent presence"

          code=$(curl -sS -o "$OUT" -w "%{http_code}" "$BASE_URL/api/docs")
          [ "$code" = "200" ] || fail "/api/docs expected 200 got $code"
          pass "/api/docs"

          code=$(curl -sS -o "$OUT" -w "%{http_code}" "$BASE_URL/.well-known/agent.json")
          [ "$code" = "200" ] || fail "/.well-known/agent.json expected 200 got $code"
          pass "agent discovery"

          MCP_HEADERS="$TMP_DIR/mcp-headers.txt"
          code=$(curl -sS -D "$MCP_HEADERS" -o "$OUT" -w "%{http_code}" -X POST "$BASE_URL/api/mcp" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"list_agents","arguments":{"limit":1}}}')
          [ "$code" = "402" ] || fail "MCP payment challenge expected 402 got $code"
          grep -Eiq '^www-authenticate:[[:space:]]*Payment ' "$MCP_HEADERS" || fail "MCP payment challenge header missing"
          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const challenge=data?.error?.data?.challenges?.[0]; if(!challenge || challenge.realm !== 'clawdmkt.com') process.exit(1)" "$OUT" \
            || fail "MCP JSON-RPC challenge or canonical realm missing"
          pass "MCP payment challenge"

          code=$(curl -sS -o "$OUT" -w "%{http_code}" "$BASE_URL/api/listings/demo-code-review")
          [ "$code" = "404" ] || fail "legacy demo listing expected 404 got $code"
          pass "legacy demo inventory absent"

          node scripts/prod-wallet-smoke.mjs || fail "signed wallet authentication"
          pass "signed wallet authentication"

          node scripts/prod-agent-canary.mjs || fail "autonomous agent lifecycle canary"
          pass "autonomous agent lifecycle canary"

          login_payload=$(printf '{"email":"%s","password":"%s"}' "$SMOKE_EMAIL" "$SMOKE_PASSWORD")
          code=$(curl -sS -c "$COOKIES" -b "$COOKIES" -H 'Content-Type: application/json' -d "$login_payload" -o "$OUT" -w "%{http_code}" "$BASE_URL/api/auth/login")
          [ "$code" = "200" ] || fail "login expected 200 got $code"
          pass "auth login"

          csrf=$(awk '/csrf-token/ {print $7}' "$COOKIES" | tail -n1)
          [ -n "$csrf" ] || fail "csrf token cookie missing after login"

          code=$(curl -sS -b "$COOKIES" -o "$OUT" -w "%{http_code}" "$BASE_URL/api/auth/me")
          [ "$code" = "200" ] || fail "/api/auth/me expected 200 got $code"
          pass "auth me"

          code=$(curl -sS -b "$COOKIES" -o "$OUT" -w "%{http_code}" "$BASE_URL/api/analytics/summary")
          [ "$code" = "200" ] || fail "/api/analytics/summary expected 200 got $code"
          pass "analytics summary"

          key_name="Smoke Key $(date +%s)"
          code=$(curl -sS -b "$COOKIES" -c "$COOKIES" -H 'Content-Type: application/json' -H "X-CSRF-Token: $csrf" -d "{\"name\":\"$key_name\"}" -o "$OUT" -w "%{http_code}" "$BASE_URL/api/auth/api-keys")
          [ "$code" = "201" ] || fail "api key create expected 201 got $code"
          key_id=$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' "$OUT" | head -n1)
          [ -n "$key_id" ] || fail "api key id missing from create response"
          pass "api key create"

          code=$(curl -sS -X DELETE -b "$COOKIES" -H "X-CSRF-Token: $csrf" -o "$OUT" -w "%{http_code}" "$BASE_URL/api/auth/api-keys/$key_id")
          [ "$code" = "200" ] || fail "api key revoke expected 200 got $code"
          pass "api key revoke"

          listing_title="Smoke Listing $(date +%s)"
          listing_desc="Production smoke listing used for post-deploy verification and cleanup."
          code=$(curl -sS -b "$COOKIES" -c "$COOKIES" -H 'Content-Type: application/json' -H "X-CSRF-Token: $csrf" -d "{\"category\":\"skills\",\"title\":\"$listing_title\",\"description\":\"$listing_desc\",\"price_bankr\":1200}" -o "$OUT" -w "%{http_code}" "$BASE_URL/api/listings")
          [ "$code" = "201" ] || fail "listing create expected 201 got $code"
          listing_id=$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' "$OUT" | head -n1)
          [ -n "$listing_id" ] || fail "listing id missing from create response"
          pass "listing create"

          code=$(curl -sS -X DELETE -b "$COOKIES" -H "X-CSRF-Token: $csrf" -o "$OUT" -w "%{http_code}" "$BASE_URL/api/listings/$listing_id")
          [ "$code" = "200" ] || fail "listing delete expected 200 got $code"
          pass "listing delete"

          code=$(curl -sS -b "$COOKIES" -o "$OUT" -w "%{http_code}" "$BASE_URL/api/trades")
          [ "$code" = "200" ] || fail "/api/trades expected 200 got $code"
          pass "trades list"

          code=$(curl -sS -X POST -b "$COOKIES" -H "X-CSRF-Token: $csrf" -o "$OUT" -w "%{http_code}" "$BASE_URL/api/auth/logout")
          [ "$code" = "200" ] || fail "logout expected 200 got $code"
          pass "auth logout"

          {
            echo "## Production smoke summary"
            printf '%s\n' "- Base URL: $BASE_URL"
            echo "- ✅ Liveness/readiness/full diagnostics/docs/discovery"
            echo "- ✅ Authenticated agent presence"
            echo "- ✅ Private autonomous agent registration, listing, archival, and key revocation"
            echo "- ✅ Atomic agent key rotation, bounded overlap, and previous-key revocation"
            echo "- ✅ Auth login/me/logout"
            echo "- ✅ SIWE wallet login/replay rejection"
            echo "- ✅ MCP machine-readable + HTTP payment challenge"
            echo "- ✅ Legacy demo inventory absent"
            echo "- ✅ Analytics summary"
            echo "- ✅ API key create/revoke"
            echo "- ✅ Listing create/delete"
            echo "- ✅ Trades list"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 Production Smoke failed on ${{ github.repository }} (${{ github.ref_name }}). Run: $RUN_URL"
          curl -sS -X POST "$ALERT_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"$MSG\",\"content\":\"$MSG\"}" >/dev/null
