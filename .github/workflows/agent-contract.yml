name: Agent Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: '1'
  TURSO_DATABASE_URL: file:./ci-agent-contract.db
  JWT_SECRET: ci-jwt-secret-please-change

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Agent contract tests
        run: pnpm run test:agent-contract

      - name: Operator console proxy tests
        run: node --import tsx --test tests/proxy/operator-console.test.ts

      - name: Production build
        run: pnpm run build
