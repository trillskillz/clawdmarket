name: Production Payment Canary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight or execute a guarded low-value payment on one rail'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - run-low-value-payment
          - run-seller-payout
          - run-low-value-mpp
          - configure-seller-payout
          - recover-base-payment

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: production-payment-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      BASE_URL: ${{ (secrets.PROD_BASE_URL != '' && secrets.PROD_BASE_URL) || 'https://www.clawdmkt.com' }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      WALLET_SMOKE_PRIVATE_KEY: ${{ secrets.WALLET_SMOKE_PRIVATE_KEY }}
      WALLET_SMOKE_ADDRESS: ${{ vars.WALLET_SMOKE_ADDRESS }}
      CONFIRM_REAL_PAYMENT_CANARY: ${{ inputs.mode == 'run-low-value-payment' && 'RUN_LOW_VALUE_REAL_PAYMENT' || 'PREFLIGHT_ONLY' }}
      CONFIRM_REAL_SELLER_PAYOUT_CANARY: ${{ inputs.mode == 'run-seller-payout' && 'RUN_LOW_VALUE_REAL_SELLER_PAYOUT' || 'PREFLIGHT_ONLY' }}
      CONFIRM_REAL_MPP_CANARY: ${{ inputs.mode == 'run-low-value-mpp' && 'RUN_LOW_VALUE_REAL_MPP_PAYMENT' || 'PREFLIGHT_ONLY' }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install runtime dependencies
        run: pnpm install --frozen-lockfile --prod

      - name: Check production settlement gas reserves
        if: inputs.mode != 'recover-base-payment'
        run: node scripts/prod-payment-rails-preflight.mjs

      - name: Run production payment canary
        if: inputs.mode != 'run-low-value-mpp' && inputs.mode != 'configure-seller-payout' && inputs.mode != 'recover-base-payment'
        run: node scripts/prod-payment-canary.mjs

      - name: Run production Tempo MPP canary
        if: inputs.mode == 'run-low-value-mpp'
        run: node scripts/prod-mpp-canary.mjs

      - name: Configure the dedicated smoke seller payout address
        if: inputs.mode == 'configure-seller-payout'
        run: node scripts/set-smoke-seller-payout.mjs

      - name: Recover and refund the existing Base canary payment
        if: inputs.mode == 'recover-base-payment'
        run: node scripts/recover-base-canary.mjs
